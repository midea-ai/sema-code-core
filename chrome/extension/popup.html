<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sema 浏览器控制</title>
<style>
  body { font: 13px/1.5 system-ui, -apple-system, sans-serif; margin: 0; width: 320px; color: #1f2933; background: #fff; }
  section { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
  section:last-child { border-bottom: 0; }
  h1 { font-size: 14px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 12px; margin: 0 0 6px; color: #52606d; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa5b1; flex: none; }
  .dot.on { background: #16a34a; }
  .dot.off { background: #d13438; }
  .dot.stopped { background: #d97706; }
  .muted { color: #7b8794; font-size: 12px; margin: 0; word-break: break-all; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  li .host { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; flex: 1; word-break: break-all; }
  li .kind { font-size: 11px; color: #7b8794; flex: none; }
  button { font: inherit; padding: 4px 10px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; color: #1f2933; cursor: pointer; }
  button.link { border: 0; padding: 2px 4px; color: #b42318; font-size: 12px; }
  h1 #state { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.stop { flex: none; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #d13438; border-color: #d13438; color: #fff; }
  button.resume { flex: none; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #16a34a; border-color: #16a34a; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .stopped-note { color: #b45309; font-size: 12px; margin: 6px 0 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type="text"] { flex: 1; font: inherit; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 5px; min-width: 0; }
  label.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0 0 6px; }
  label.switch input { margin: 0; }
</style>
</head>
<body>
  <section>
    <h1>
      <span class="dot" id="dot"></span><span id="state">连接中…</span>
      <button id="stop" class="stop" hidden>停止</button>
      <button id="resume" class="resume" hidden>继续</button>
    </h1>
    <p class="muted" id="detail"></p>
    <p class="stopped-note" id="stoppedNote" hidden>Agent 的浏览器操作已暂停，点"继续"恢复</p>
  </section>
  <section>
    <h2>禁止访问的站点</h2>
    <div class="row">
      <input type="text" id="blockInput" placeholder="例如 bank.com">
      <button id="blockAdd">添加</button>
    </div>
    <ul id="block"></ul>
  </section>
  <section>
    <h2>站点授权</h2>
    <label class="switch"><input type="checkbox" id="ask"><span>访问前询问</span></label>
    <ul id="auth" hidden></ul>
  </section>
  <script src="popup.js"></script>
</body>
</html>
